<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bpmn-js-animation — simulator & playback</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    #app { display: flex; flex-direction: column; height: 100%; }
    #toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 8px; border-bottom: 1px solid #ccc; background: #fafafa;
    }
    #toolbar button, #toolbar select {
      padding: 5px 10px; border: 1px solid #bbb; border-radius: 4px;
      background: #fff; cursor: pointer; font-size: 13px;
    }
    #toolbar button:hover { background: #eee; }
    #toolbar button:disabled { opacity: 0.5; cursor: default; }
    #toolbar .sep { width: 1px; align-self: stretch; background: #ddd; margin: 0 4px; }
    #toolbar .hint { font-size: 13px; color: #555; }
    #toolbar label { font-size: 13px; color: #333; display: inline-flex; align-items: center; gap: 4px; }
    #toolbar .spacer { flex: 1; }
    /* the mode toggle: two segmented buttons, the active one highlighted */
    #mode { display: inline-flex; }
    #mode button { border-radius: 0; }
    #mode button:first-child { border-radius: 4px 0 0 4px; }
    #mode button:last-child { border-radius: 0 4px 4px 0; border-left: none; }
    #mode button.active { background: #06c; color: #fff; border-color: #06c; }
    /* mode-specific controls — shown for the active mode only */
    .only-simulate, .only-play { display: none; align-items: center; gap: 8px; }
    body.mode-simulate .only-simulate { display: inline-flex; }
    body.mode-play .only-play { display: inline-flex; }
    #main { flex: 1; position: relative; min-height: 0; }
    #canvas { position: absolute; inset: 0; }
    #placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #999; font-size: 15px; pointer-events: none; text-align: center; padding: 0 24px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <span id="mode" title="drive the model interactively, or replay an event log">
        <button id="modeSimulate" class="active">Simulation</button>
        <button id="modePlay">Playback</button>
      </span>
      <span class="sep"></span>

      <button id="load">Load diagram…</button>
      <input type="file" id="file" accept=".bpmn,.xml" hidden />
      <select id="examples" autocomplete="off" title="load a bundled example">
        <option value="">Examples…</option>
      </select>
      <span class="sep"></span>

      <!-- Simulate-mode controls -->
      <span class="only-simulate">
        <button id="download" title="download the recorded event log as JSON">⬇ Download log</button>
      </span>

      <!-- Play-mode controls -->
      <span class="only-play">
        <button id="loadLog" title="load an event log (.json)">Load log…</button>
        <input type="file" id="logFile" accept=".json" hidden />
        <button id="play">▶ Start</button>
        <button id="pause" hidden title="pause / resume the playback">⏸ Pause</button>
        <label title="follow each event's instance (scroll to it); off keeps the view fixed">
          <input type="checkbox" id="autofocus" checked /> auto-focus
        </label>
      </span>

      <span class="spacer"></span>
      <span class="hint only-simulate">double-click the <b>start event</b> to spawn · double-click a <b>token</b> to advance</span>
      <span class="hint only-play">the <b>animator</b> replays a BPMN <b>event log</b> · ▶ Start to play, ↻ Refresh to stop</span>
      <span class="sep"></span>

      <!-- shared across modes (same label + position): reset the diagram, then drive / replay over -->
      <button id="refresh" title="reset to an empty diagram (stops a running playback)">↻ Refresh</button>
    </div>
    <div id="main">
      <div id="canvas"></div>
      <div id="placeholder">Pick an example or load a diagram to begin.</div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
