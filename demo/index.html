<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bpmn-js-animation — simulator & playback</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    #app { display: flex; flex-direction: column; height: 100%; }
    #toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 8px; border-bottom: 1px solid #ccc; background: #fafafa;
    }
    #toolbar button, #toolbar select {
      padding: 5px 10px; border: 1px solid #bbb; border-radius: 4px;
      background: #fff; cursor: pointer; font-size: 13px;
    }
    #toolbar button:hover { background: #eee; }
    #toolbar button:disabled { opacity: 0.5; cursor: default; }
    #toolbar .sep { width: 1px; align-self: stretch; background: #ddd; margin: 0 4px; }
    #toolbar .hint { font-size: 13px; color: #555; }
    #toolbar .spacer { flex: 1; }
    /* the mode toggle: two segmented buttons, the active one highlighted */
    #mode { display: inline-flex; }
    #mode button { border-radius: 0; }
    #mode button:first-child { border-radius: 4px 0 0 4px; }
    #mode button:last-child { border-radius: 0 4px 4px 0; border-left: none; }
    #mode button.active { background: #06c; color: #fff; border-color: #06c; }
    /* a setting rather than an action: it stays down while it is on, and says so by inverting */
    #autoFocus { display: inline-flex; align-items: center; gap: 6px; }
    #autoFocus svg {
      width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }
    #autoFocus[aria-pressed="true"] { background: #06c; color: #fff; border-color: #06c; }
    /* mode-specific hints — shown for the active mode only */
    .hint.only-simulate, .hint.only-play { display: none; }
    body.mode-simulate .hint.only-simulate { display: inline; }
    body.mode-play .hint.only-play { display: inline; }
    /* canvas + side panel side by side */
    #main { flex: 1; display: flex; min-height: 0; }
    #canvas { flex: 1; position: relative; }
    #canvas .djs-container svg:focus { outline: none; }
    #side-panel { flex: 0 0 auto; width: 320px; }
    #placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #999; font-size: 15px; pointer-events: none; text-align: center; padding: 0 24px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <span id="mode" title="drive the model interactively, or replay an event log">
        <button id="modeSimulate" class="active">Simulation</button>
        <button id="modePlay">Playback</button>
      </span>
      <span class="sep"></span>

      <button id="autoFocus" type="button" aria-pressed="false"
              title="Follow the run: bring the active instance to the front and drill to its plane"></button>
      <span class="sep"></span>

      <button id="load">Load diagram…</button>
      <input type="file" id="file" accept=".bpmn,.xml" hidden />
      <select id="examples" autocomplete="off" title="load a bundled example">
        <option value="">Examples…</option>
      </select>

      <span class="spacer"></span>
      <span class="hint only-simulate">double-click the <b>start event</b> to spawn · double-click a <b>token</b> to advance · controls in the <b>Simulation</b> panel →</span>
      <span class="hint only-play">replay a BPMN <b>event log</b> from the <b>Simulation</b> panel →</span>
    </div>
    <div id="main">
      <div id="canvas">
        <div id="placeholder">Pick an example or load a diagram to begin.</div>
      </div>
      <div id="side-panel"></div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
