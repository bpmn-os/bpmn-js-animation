<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bpmn-js-animation — Simulator</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    #app { display: flex; flex-direction: column; height: 100%; }
    #toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 8px; border-bottom: 1px solid #ccc; background: #fafafa;
    }
    #toolbar button {
      padding: 5px 10px; border: 1px solid #bbb; border-radius: 4px;
      background: #fff; cursor: pointer; font-size: 13px;
    }
    #toolbar button:hover { background: #eee; }
    #toolbar label { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; }
    #toolbar .sep { width: 1px; align-self: stretch; background: #ddd; margin: 0 4px; }
    #toolbar .hint { font-size: 13px; color: #555; }
    #main { flex: 1; display: flex; min-height: 0; }
    #canvas { flex: 1; }
    #log {
      width: 280px; border-left: 1px solid #ccc; padding: 8px;
      overflow: auto; font-family: monospace; font-size: 12px; background: #fcfcfc;
    }
    #log div { padding: 2px 0; border-bottom: 1px solid #eee; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <label>diagram
        <select id="diagram" autocomplete="off">
          <option value="linear">linear (start → task → end)</option>
          <option value="process">process (split + loop task; MI/boundary — partial)</option>
        </select>
      </label>
      <span class="sep"></span>
      <span class="hint">double-click the <b>start event</b> to spawn · double-click a <b>token</b> to advance it</span>
      <span class="sep"></span>
      <button id="clear">clear tokens</button>
    </div>
    <div id="main">
      <div id="canvas"></div>
      <div id="log"></div>
    </div>
  </div>
  <script type="module" src="./simulator.js"></script>
</body>
</html>
