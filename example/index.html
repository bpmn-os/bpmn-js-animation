<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bpmn-js-animation — playground</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    #app { display: flex; flex-direction: column; height: 100%; }
    #toolbar {
      display: flex; flex-direction: column; gap: 6px;
      padding: 8px; border-bottom: 1px solid #ccc; background: #fafafa;
    }
    #toolbar .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    #toolbar button {
      padding: 5px 9px; border: 1px solid #bbb; border-radius: 4px;
      background: #fff; cursor: pointer; font-size: 13px;
    }
    #toolbar button:hover { background: #eee; }
    #toolbar .sep { width: 1px; align-self: stretch; background: #ddd; margin: 0 4px; }
    #toolbar label { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; }
    #toolbar select, #toolbar input { font-size: 13px; }
    #toolbar .readout { font-size: 13px; color: #444; }
    #toolbar .readout b { color: #111; }
    #main { flex: 1; display: flex; min-height: 0; }
    #canvas { flex: 1; }
    #log {
      width: 280px; border-left: 1px solid #ccc; padding: 8px;
      overflow: auto; font-family: monospace; font-size: 12px; background: #fcfcfc;
    }
    #log div { padding: 2px 0; border-bottom: 1px solid #eee; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <div class="row">
        <span class="readout">node: <b id="cur-node">—</b></span>
        <span class="readout">token: <b id="cur-token">—</b></span>
        <span class="sep"></span>
        <label><input type="checkbox" id="bounce" /> bounce</label>
        <span class="sep"></span>
        <label>location
          <select id="location"><!-- 9 anchor positions + the current node's connected flows (populated dynamically) --></select>
        </label>
        <span class="sep"></span>
        <button id="setState">setState</button>
      </div>
      <div class="row">
        <button id="createToken">createToken</button>
        <button id="sendToken">sendToken</button>
        <button id="removeToken">removeToken</button>
        <span class="sep"></span>
        <button id="clear">clear</button>
        <button id="randomInstances" title="populate the selected container with random per-instance scope tokens + nested stacks">random instances</button>
      </div>
      <div class="row">
        <label>stack size <input type="number" id="stackSize" min="1" value="1" style="width: 48px" /></label>
        <button id="setStackSize">setStackSize</button>
        <button id="scrollBack">scroll ◀</button>
        <button id="scrollFwd">scroll ▶</button>
        <span class="sep"></span>
        <button id="throwIcon">throwIcon</button>
        <button id="catchIcon">catchIcon</button>
      </div>
    </div>
    <div id="main">
      <div id="canvas"></div>
      <div id="log"></div>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
